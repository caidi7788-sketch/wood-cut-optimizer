 <!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冠紳木工－板材最佳化裁切計算機</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#24313b;background:#f3f5f6}*{box-sizing:border-box}body{margin:0}header{background:#263b48;color:white;padding:16px 20px}h1{font-size:21px;margin:0}header small{opacity:.8}.wrap{max-width:1200px;margin:auto;padding:14px}.panel{background:white;border-radius:13px;padding:16px;margin-bottom:14px;box-shadow:0 2px 9px #0001}h2{font-size:17px;margin:0 0 13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.field label{display:block;font-size:12px;color:#667;margin-bottom:5px}input,select{width:100%;border:1px solid #ccd5da;border-radius:7px;padding:10px;background:white;font-size:15px;min-width:0}button{background:#24658c;color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:650;cursor:pointer}button.secondary{background:#e7edf1;color:#234}button.danger{background:#fce9e9;color:#a33}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.entry{padding:12px;background:#f5f8f9;border-radius:9px;margin:9px 0;border-left:5px solid var(--mat)}.entrygrid{display:grid;grid-template-columns:1.5fr 2fr repeat(3,1fr) auto auto;gap:8px;align-items:end}.check{display:flex;align-items:center;gap:5px;font-size:14px;white-space:nowrap;padding-bottom:10px}.check input{width:auto}.entry button{align-self:end}.note{font-size:12px;color:#65747d;line-height:1.7}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{padding:12px;border-radius:9px;background:#eef4f7;min-width:125px;flex:1}.stat b{display:block;font-size:23px}.sheet{margin:16px 0;border-top:1px solid #e5e8eb;padding-top:14px}.sheethead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.swatch{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:5px;vertical-align:middle}.canvaswrap{overflow:auto;touch-action:pan-x pan-y;border:1px solid #e3e6e8;background:#fafafa;border-radius:8px;padding:12px;margin-top:8px}.sheet svg{display:block;max-width:100%;height:auto;margin:auto}.canvaswrap{overflow:auto;display:flex;justify-content:center;align-items:flex-start}.sheetnote{font-size:12px;color:#526572;margin-top:7px}.canvaswrap{touch-action:pan-x pan-y;justify-content:flex-start}.zoomtools{display:flex;align-items:center;gap:8px;margin:8px 0}.zoomtools button{padding:6px 12px}.zoomtools span{font-size:12px;color:#526572}.canvaswrap svg{max-width:none!important;flex:none}.canvaswrap{min-height:240px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px}.error{color:#a33;font-size:13px;white-space:pre-line}.hidden{display:none}@media(max-width:800px){.entrygrid{grid-template-columns:repeat(3,minmax(0,1fr))}.entrygrid .name{grid-column:span 1}.entrygrid .material{grid-column:span 2}.entrygrid .check{align-self:center;padding:0}.entrygrid button{padding:10px}.wrap{padding:9px}.panel{padding:12px}}@media print{header,.no-print,.panel.controls{display:none!important}body{background:white}.panel{box-shadow:none}.canvaswrap{overflow:visible}.sheet{break-inside:avoid}}.material-breakdown{margin-top:9px;display:grid;gap:8px;font-size:14px}.material-breakdown>div{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.material-breakdown b{margin-left:auto;font-size:16px;white-space:nowrap}.material-breakdown .swatch{flex-shrink:0}</style></head><body><header><h1>冠紳木工｜板材最佳化裁切計算機</h1><small>板材分類 · 自訂裁切 · 抽屜展開 · 方向箭頭 · 存讀檔</small></header><main class="wrap"><section class="panel controls"><h2>原始板材設定</h2><div class="grid"><div class="field"><label>長（cm）</label><input id="stockL" type="number" min="1" step="0.1" value="242"></div><div class="field"><label>寬（cm）</label><input id="stockW" type="number" min="1" step="0.1" value="122"></div><div class="field"><label>鋸路（cm）</label><input id="kerf" type="number" min="0" step="0.1" value="0.3"></div></div><p class="note">母板木紋預設沿長邊（242cm）。每筆板材預設直紋；勾選「旋轉」後，該筆零件允許在母板上旋轉90°，箭頭同步轉向。最佳化使用啟發式排版，並非保證數學上的絕對最優；請依現場裁板機切割方式核對。</p></section><section class="panel controls"><h2>裁切清單</h2><div id="entries"></div><div class="toolbar"><button id="add">＋ 新增板材</button><button id="addDrawer" class="secondary">＋ 新增抽屜</button></div></section><section class="panel controls"><h2>抽屜設定</h2><div id="drawers"></div><p class="note">每組抽屜：雙面波麗木芯板抽面1片、前後內牆2片、左右內牆2片；2分波麗背板抽底1片。內牆長＝輸入長−2cm；內牆高＝輸入高−2cm。深度25～60cm，每5cm一級。</p></section><section class="panel controls"><div class="toolbar"><button id="save" class="secondary">存檔</button><button id="load" class="secondary">讀檔</button><button id="print" class="secondary">列印</button><input id="file" type="file" accept=".json,application/json" class="hidden"></div><div id="error" class="error"></div></section><section class="panel" id="results"><h2>材料裁切圖</h2><p class="note">輸入尺寸後自動更新裁切圖，完整顯示原始母板。</p></section></main><script>
const mats=[['白身木芯板','#dfc49a'],['單面波麗木芯板','#8dbbd9'],['雙面波麗木芯板','#7cbea6'],['2分波麗背板','#b9a6d8'],['1分木皮面板','#dda778'],['自訂板材','#d98e95']];
let state={parts:[{id:1,name:'側板',mat:1,l:80,w:55,qty:2,rotate:false},{id:2,name:'層板',mat:2,l:96,w:55,qty:2,rotate:false}],drawers:[]},nextId=3;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number(v);const fmt=v=>Number(v.toFixed(2)).toString();
function materialName(p){return p.mat===5?(String(p.customMat||'').trim()||'未命名自訂板材'):mats[p.mat][0]}
function materialColor(p){if(p.mat!==5)return mats[p.mat][1];let name=materialName(p),h=0;for(const c of name)h=(h*31+c.charCodeAt(0))>>>0;return `hsl(${h%360} 55% 76%)`}
function entryHTML(p){return `<div class="entry" style="--mat:${materialColor(p)}"><div class="entrygrid"><div class="field name"><label>名稱</label><input data-id="${p.id}" data-key="name" value="${esc(p.name)}"></div><div class="field material"><label>板材種類</label><select data-id="${p.id}" data-key="mat">${mats.map((m,i)=>`<option value="${i}" ${i===p.mat?'selected':''}>${m[0]}</option>`).join('')}</select>${p.mat===5?`<input style="margin-top:6px" placeholder="輸入板材花色／名稱" aria-label="自訂板材名稱" data-id="${p.id}" data-key="customMat" value="${esc(p.customMat||'')}">`:''}</div>${[['l','長'],['w','寬'],['qty','數量']].map(([k,t])=>`<div class="field"><label>${t}${k==='qty'?'':' (cm)'}</label><input type="number" min="${k==='qty'?1:0.1}" step="${k==='qty'?1:0.1}" data-id="${p.id}" data-key="${k}" value="${p[k]}"></div>`).join('')}<label class="check"><input type="checkbox" data-id="${p.id}" data-key="rotate" ${p.rotate?'checked':''}>旋轉</label><button class="danger" data-remove="${p.id}">刪除</button></div></div>`}
function drawerHTML(d){return `<div class="entry" style="--mat:#7cbea6"><div class="entrygrid"><div class="field name"><label>名稱</label><input data-did="${d.id}" data-key="name" value="${esc(d.name)}"></div><div class="field"><label>長 (cm)</label><input type="number" min="2.1" step="0.1" data-did="${d.id}" data-key="l" value="${d.l}"></div><div class="field"><label>深 (cm)</label><select data-did="${d.id}" data-key="depth">${[25,30,35,40,45,50,55,60].map(x=>`<option ${x===n(d.depth)?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>高 (cm)</label><input type="number" min="2.1" step="0.1" data-did="${d.id}" data-key="h" value="${d.h}"></div><div class="field"><label>數量</label><input type="number" min="1" step="1" data-did="${d.id}" data-key="qty" value="${d.qty}"></div><span class="note">固定材質</span><button class="danger" data-remove-d="${d.id}">刪除</button></div></div>`}
function renderForms(){$('entries').innerHTML=state.parts.map(entryHTML).join('')||'<p class="note">尚無一般板材。</p>';$('drawers').innerHTML=state.drawers.map(drawerHTML).join('')||'<p class="note">尚無抽屜。</p>'}
let updateTimer;function scheduleUpdate(){clearTimeout(updateTimer);updateTimer=setTimeout(calculate,180)}
function handleInput(e){const el=e.target,k=el.dataset.key;if(!k)return;const id=n(el.dataset.id),did=n(el.dataset.did);let p=state.parts.find(x=>x.id===id)||state.drawers.find(x=>x.id===did);if(!p)return;p[k]=el.type==='checkbox'?el.checked:(['name','customMat'].includes(k)?el.value:n(el.value));if(k==='mat'){if(p.mat===5&&!p.customMat)p.customMat='';renderForms();}scheduleUpdate()}
document.addEventListener('input',handleInput);document.addEventListener('change',handleInput);document.addEventListener('click',e=>{const a=e.target.closest('[data-remove],[data-remove-d]');if(!a)return;if(a.dataset.remove){state.parts=state.parts.filter(x=>x.id!==n(a.dataset.remove))}else{state.drawers=state.drawers.filter(x=>x.id!==n(a.dataset.removeD))}renderForms();scheduleUpdate()});$('add').onclick=()=>{state.parts.push({id:nextId++,name:'新板材',mat:0,l:80,w:50,qty:1,rotate:false});renderForms();scheduleUpdate()};$('addDrawer').onclick=()=>{state.drawers.push({id:nextId++,name:'抽屜',l:60,depth:45,h:20,qty:1});renderForms();scheduleUpdate()};
function getPieces(){const out=[];for(const p of state.parts){if(!p.name.trim()||(p.mat===5&&!String(p.customMat||'').trim())||!Number.isFinite(n(p.l))||!Number.isFinite(n(p.w))||n(p.l)<=0||n(p.w)<=0||!Number.isInteger(n(p.qty))||p.qty<1||!mats[p.mat])throw Error('一般板材名稱、尺寸、數量或種類有誤');for(let i=0;i<p.qty;i++)out.push({name:p.name,mat:p.mat,l:n(p.l),w:n(p.w),rotate:!!p.rotate,customMat:p.customMat||''})}for(const d of state.drawers){if(!d.name.trim()||!(d.l>2&&d.h>2)||![25,30,35,40,45,50,55,60].includes(n(d.depth))||!Number.isInteger(n(d.qty))||d.qty<1)throw Error('抽屜尺寸或數量有誤');for(let j=0;j<d.qty;j++){let name=d.name+(d.qty>1?' '+(j+1):'');out.push({name:name+' 抽面',mat:2,l:n(d.l),w:n(d.h),rotate:false},{name:name+' 前內牆',mat:2,l:n(d.l)-2,w:n(d.h)-2,rotate:false},{name:name+' 後內牆',mat:2,l:n(d.l)-2,w:n(d.h)-2,rotate:false},{name:name+' 左內牆',mat:2,l:n(d.depth),w:n(d.h)-2,rotate:false},{name:name+' 右內牆',mat:2,l:n(d.depth),w:n(d.h)-2,rotate:false},{name:name+' 抽底',mat:3,l:n(d.l)-2,w:n(d.depth),rotate:false})}}return out}
// MaxRects-style free rectangles, with kerf represented as spacing to the right and bottom of each placement.
function splitFree(free,used){const out=[];for(const f of free){if(used.x>=f.x+f.w-1e-8||used.x+used.w<=f.x+1e-8||used.y>=f.y+f.h-1e-8||used.y+used.h<=f.y+1e-8){out.push(f);continue}if(used.x>f.x+1e-8)out.push({x:f.x,y:f.y,w:used.x-f.x,h:f.h});if(used.x+used.w<f.x+f.w-1e-8)out.push({x:used.x+used.w,y:f.y,w:f.x+f.w-used.x-used.w,h:f.h});if(used.y>f.y+1e-8)out.push({x:f.x,y:f.y,w:f.w,h:used.y-f.y});if(used.y+used.h<f.y+f.h-1e-8)out.push({x:f.x,y:used.y+used.h,w:f.w,h:f.y+f.h-used.y-used.h})}return out.filter((a,i)=>a.w>1e-7&&a.h>1e-7&&!out.some((b,j)=>j!==i&&b.x<=a.x+1e-7&&b.y<=a.y+1e-7&&b.x+b.w>=a.x+a.w-1e-7&&b.y+b.h>=a.y+a.h-1e-7&&(b.w*b.h>a.w*a.h+1e-7||j<i)))}
function pack(pieces,L,W,k,sortMethod){const bins=[];let sorted=[...pieces].sort((a,b)=>sortMethod===0?Math.max(b.l,b.w)-Math.max(a.l,a.w)||b.l*b.w-a.l*a.w:sortMethod===1?b.l*b.w-a.l*a.w:Math.min(b.l,b.w)-Math.min(a.l,a.w));for(const p of sorted){let best=null;for(let bi=0;bi<=bins.length;bi++){let free=bi===bins.length?[{x:0,y:0,w:L,h:W}]:bins[bi].free;for(const f of free)for(const rot of p.rotate?[false,true]:[false]){let w=rot?p.w:p.l,h=rot?p.l:p.w;if(w>f.w+1e-8||h>f.h+1e-8)continue;let score=(bi===bins.length?1e12:0)+Math.min(f.w-w,f.h-h)*1e5+Math.max(f.w-w,f.h-h)*100+f.y*.01+f.x*.001;if(!best||score<best.score)best={bi,x:f.x,y:f.y,w,h,rot,score,p}}}if(!best)throw Error(`「${p.name}」${p.l}×${p.w} cm 超出母板尺寸，無法放入`);if(best.bi===bins.length)bins.push({free:[{x:0,y:0,w:L,h:W}],placed:[]});const bin=bins[best.bi];bin.placed.push(best);const cut={x:best.x,y:best.y,w:Math.min(L-best.x,best.w+k),h:Math.min(W-best.y,best.h+k)};bin.free=splitFree(bin.free,cut)}return bins}
function leftovers(bin,L,W,k){
 // Derive non-overlapping empty rectangles from a coordinate grid of all placed part/kerf edges.
 const xs=[0,L],ys=[0,W];for(const p of bin.placed){xs.push(p.x,Math.min(L,p.x+p.w+k));ys.push(p.y,Math.min(W,p.y+p.h+k))}
 const uniq=a=>[...new Set(a.map(v=>+v.toFixed(5)))].sort((a,b)=>a-b);let xx=uniq(xs),yy=uniq(ys),rows=yy.length-1,cols=xx.length-1;
 let occupied=Array.from({length:rows},()=>Array(cols).fill(false));
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let cx=(xx[x]+xx[x+1])/2,cy=(yy[y]+yy[y+1])/2;occupied[y][x]=bin.placed.some(p=>cx>=p.x-1e-6&&cx<Math.min(L,p.x+p.w+k)-1e-6&&cy>=p.y-1e-6&&cy<Math.min(W,p.y+p.h+k)-1e-6)}
 let out=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(!occupied[y][x]){let end=x+1;while(end<cols&&!occupied[y][end])end++;let bottom=y+1;while(bottom<rows&&Array.from({length:end-x},(_,i)=>x+i).every(j=>!occupied[bottom][j]))bottom++;for(let r=y;r<bottom;r++)for(let c=x;c<end;c++)occupied[r][c]=true;out.push({x:xx[x],y:yy[y],w:xx[end]-xx[x],h:yy[bottom]-yy[y]})}return out.sort((a,b)=>b.w*b.h-a.w*a.h)
}
function svgSheet(bin,L,W,k){
// Motherboard is displayed upright: width = short edge, height = long edge.
const scale=Math.min(3.2,520/W,760/L),sw=W*scale,sh=L*scale;
let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${sw+24}" height="${sh+24}" viewBox="-12 -12 ${W+24/scale} ${L+24/scale}" style="width:${sw+24}px;height:${sh+24}px;max-width:none;flex:none"><rect width="${W}" height="${L}" fill="#f2e8d8" stroke="#45525a" stroke-width=".6"/>`;
// Packing uses long edge as X; display maps X to vertical and Y to horizontal.
for(const f of leftovers(bin,L,W,k)){
 if(f.w<8||f.h<8)continue;
 const x=f.y,y=f.x,w=f.h,h=f.w,cx=x+w/2,cy=y+h/2,fs=Math.min(4,Math.max(2.1,Math.min(w,h)/12));
 s+=`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#e5e8e7" stroke="#8b979a" stroke-width=".25" stroke-dasharray="1.4 1.2"/><text x="${cx}" y="${cy-fs*.4}" text-anchor="middle" font-size="${fs}" fill="#57666d">剩料</text><text x="${cx}" y="${cy+fs*.9}" text-anchor="middle" font-size="${fs}" fill="#57666d">${fmt(f.w)}×${fmt(f.h)}</text></g>`;
}
for(const p of bin.placed){
 const x=p.y,y=p.x,w=p.h,h=p.w,cx=x+w/2,cy=y+h/2,color=materialColor(p.p);
 const fs=Math.max(2.1,Math.min(5,Math.min(w/Math.max(8,p.p.name.length+2),h/4)));
 // Default long-edge grain is vertical; rotation makes it horizontal.
 const arrow=p.rot?`<path d="M ${cx-w*.23} ${cy+fs*1.4} h ${w*.46} m -${Math.min(3,w*.08)} -2 l ${Math.min(3,w*.08)} 2 l -${Math.min(3,w*.08)} 2" stroke="#155e9a" fill="none" stroke-width=".85"/>`:`<path d="M ${cx} ${cy+Math.min(h*.3,fs*2.6)} v -${Math.min(h*.44,fs*3)} m -2 2 l 2 -2 l 2 2" stroke="#155e9a" fill="none" stroke-width=".85"/>`;
 s+=`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${color}" stroke="#53616b" stroke-width=".35"/><text x="${cx}" y="${cy-fs*.65}" font-size="${fs}" text-anchor="middle" fill="#1e3038">${esc(p.p.name).slice(0,25)}</text><text x="${cx}" y="${cy+fs*.65}" font-size="${fs*.85}" text-anchor="middle" fill="#1e3038">${fmt(p.p.l)}×${fmt(p.p.w)}</text>${arrow}</g>`;
}
return s+'</svg>'}
let zoomLevel=1;
function applyZoom(){document.querySelectorAll('.canvaswrap svg').forEach(svg=>{const w=Number(svg.getAttribute('width')),h=Number(svg.getAttribute('height'));svg.style.width=(w*zoomLevel)+'px';svg.style.height=(h*zoomLevel)+'px'})}
function zoomTools(){return `<div class="zoomtools no-print"><button type="button" data-zoom="out">－</button><span>縮放 ${Math.round(zoomLevel*100)}%（可雙指縮放）</span><button type="button" data-zoom="in">＋</button><button type="button" data-zoom="reset" class="secondary">還原</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-zoom]');if(!b)return;zoomLevel=b.dataset.zoom==='reset'?1:Math.max(.35,Math.min(4,zoomLevel*(b.dataset.zoom==='in'?1.25:.8)));applyZoom();document.querySelectorAll('.zoomtools span').forEach(x=>x.textContent=`縮放 ${Math.round(zoomLevel*100)}%（可雙指縮放）`)});
let pinchDistance=0,pinchStart=1;
document.addEventListener('touchstart',e=>{if(!e.target.closest('.canvaswrap')||e.touches.length!==2)return;pinchDistance=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pinchStart=zoomLevel},{passive:true});
document.addEventListener('touchmove',e=>{if(!pinchDistance||!e.target.closest('.canvaswrap')||e.touches.length!==2)return;const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoomLevel=Math.max(.35,Math.min(4,pinchStart*d/pinchDistance));applyZoom();document.querySelectorAll('.zoomtools span').forEach(x=>x.textContent=`縮放 ${Math.round(zoomLevel*100)}%（可雙指縮放）`)},{passive:true});
document.addEventListener('touchend',e=>{if(e.touches.length<2)pinchDistance=0},{passive:true});
function calculate(){try{let L=n($('stockL').value),W=n($('stockW').value),k=n($('kerf').value);if(!(L>0&&W>0&&k>=0))throw Error('母板尺寸或鋸路有誤');let pieces=getPieces();if(!pieces.length){$('results').innerHTML='<h2>材料裁切圖</h2><p class="note">原始母板完整尺寸：'+fmt(L)+' × '+fmt(W)+' cm。新增裁切尺寸後自動排版。</p><div class="sheet">${zoomTools()}<div class="canvaswrap">'+svgSheet({placed:[]},L,W,k)+'</div></div>';applyZoom();$('error').textContent='';return;}if(pieces.length>3000)throw Error('一次最多計算3000片，請分批處理');let groups=new Map();pieces.forEach(p=>{let key=materialName(p);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)});let results=[];for(const [mat,arr] of groups){let trials=[0,1,2].map(x=>pack(arr,L,W,k,x));trials.sort((a,b)=>a.length-b.length);results.push({mat,bins:trials[0],pieces:arr,color:materialColor(arr[0])})}let count=results.reduce((a,r)=>a+r.bins.length,0),area=pieces.reduce((a,p)=>a+p.l*p.w,0),stockArea=count*L*W;let html=`<h2>材料裁切圖</h2><div class="stats"><div class="stat">板材張數<div class="material-breakdown">${results.map(r=>`<div><span class="swatch" style="background:${r.color}"></span>${esc(r.mat)} <b>${r.bins.length} 件</b></div>`).join('')}</div></div><div class="stat">裁切片數<div class="material-breakdown">${results.map(r=>`<div><span class="swatch" style="background:${r.color}"></span>${esc(r.mat)} <b>${r.pieces.length} 塊</b></div>`).join('')}</div></div><div class="stat">材料利用率<b>${fmt(area/stockArea*100)}%</b></div><div class="stat">剩餘面積比例<b>${fmt((1-area/stockArea)*100)}%</b></div></div><p class="note">剩餘面積比例包含鋸路與零散邊料，並不等於可完整再利用的餘料比例。藍色箭頭代表零件長度／木紋方向；母板長邊為木紋基準。</p>`;for(const r of results){let used=r.pieces.reduce((a,p)=>a+p.l*p.w,0);html+=`<div class="sheet"><div class="sheethead"><h2><span class="swatch" style="background:${r.color}"></span>${esc(r.mat)}</h2><span class="note">${r.bins.length} 件｜${r.pieces.length} 塊｜利用率 ${fmt(used/(r.bins.length*L*W)*100)}%</span></div>`;r.bins.forEach((b,i)=>{html+=`<div class="sheet"><b>第 ${i+1} 件｜${fmt(L)}×${fmt(W)} cm</b>${zoomTools()}<div class="canvaswrap">${svgSheet(b,L,W,k)}</div><div class="sheetnote">灰色虛線區為剩料（已扣除預留鋸路），裁切前請核對下刀順序。</div></div>`});html+='</div>'}html+='<div class="legend">'+results.map(r=>`<span><span class="swatch" style="background:${r.color}"></span>${esc(r.mat)}</span>`).join('')+'</div>';$('results').innerHTML=html;applyZoom();$('error').textContent=''}catch(e){$('error').textContent=e.message}}
['stockL','stockW','kerf'].forEach(id=>{ $(id).addEventListener('input',scheduleUpdate);$(id).addEventListener('change',scheduleUpdate)});$('print').onclick=()=>window.print();$('save').onclick=()=>{const name=prompt('請輸入檔案名稱：','板材裁切');if(name===null)return;if(!name.trim()){alert('請輸入檔案名稱');return}const payload={version:1,stock:{l:n($('stockL').value),w:n($('stockW').value),kerf:n($('kerf').value)},...state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name.trim().replace(/[\\/:*?"<>|]/g('_'))+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('load').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let p=JSON.parse(await f.text());if(!p.stock||!Array.isArray(p.parts)||!Array.isArray(p.drawers))throw Error('檔案格式不正確');$('stockL').value=p.stock.l;$('stockW').value=p.stock.w;$('kerf').value=p.stock.kerf;state={parts:p.parts.map(x=>({...x,...(x.mat===6?{mat:5,customMat:x.customMat||'美耐板B'}:x.mat===5&&!x.customMat?{customMat:'美耐板A'}:{})})),drawers:p.drawers};nextId=Math.max(0,...state.parts.map(x=>x.id),...state.drawers.map(x=>x.id))+1;renderForms();scheduleUpdate();$('error').textContent=''}catch(err){alert('讀檔失敗：'+err.message)}e.target.value=''};renderForms();calculate();
</script></body></html>
